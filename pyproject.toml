[project]
name = "gemini-video-mcp"
version = "0.2.0"
description = "Video generation MCP server (stdio) — calls Gemini Omni 1.1 Flash (gemini-omni-1.1-flash) via the Gemini interactions API using browser OAuth"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "tsukumonasu" }]
keywords = ["mcp", "gemini", "omni", "video-generation", "oauth"]
dependencies = [
    "mcp>=2.0.0,<3",
    "httpx>=0.27.0",
]

[project.urls]
Homepage = "https://github.com/tsukumonasu/gemini-video-mcp"
Repository = "https://github.com/tsukumonasu/gemini-video-mcp"

[project.scripts]
gemini-video-mcp = "gemini_video_mcp:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gemini_video_mcp"]
